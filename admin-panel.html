<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nitzani · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f4f2;--white:#fff;--ink:#111;--mid:#888;
  --lt:#e6e6e2;--ltr:#f0f0ec;--bd:#e0e0dc;
  --grn:#16a34a;--red:#dc2626;--r:14px;
  --sh:0 1px 8px rgba(0,0,0,.08);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);font-size:16px;-webkit-font-smoothing:antialiased}

/* ─── TOP BAR ─── */
.bar{height:52px;background:var(--white);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;justify-content:space-between;position:relative;z-index:50}
.bar-title{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grn);flex-shrink:0}
.gear{width:34px;height:34px;border-radius:10px;background:var(--ltr);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}

/* ─── TABS ─── */
.tabs{display:flex;background:var(--white);border-bottom:1px solid var(--bd)}
.tab{flex:1;padding:13px 0;text-align:center;font-size:14px;font-weight:500;border:none;background:transparent;color:var(--mid);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;font-family:'Inter',sans-serif}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}

/* ─── VIEWS ─── */
.views{height:calc(100vh - 52px - 48px);overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}

/* ─── FORM ─── */
.form-scroll{padding:14px 14px 120px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* Photo */
.photo-box{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;position:relative;cursor:pointer;min-height:120px}
.photo-box input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2}
.photo-empty{padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.photo-ico{width:52px;height:52px;border-radius:14px;background:var(--ltr);display:flex;align-items:center;justify-content:center;font-size:22px}
.photo-lbl{font-size:15px;font-weight:500}
.photo-sub{font-size:13px;color:var(--mid)}
.photo-img{display:none;width:100%;max-height:280px;object-fit:cover}
.photo-bar{display:none;align-items:center;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--bd)}
.photo-bar.show{display:flex}
.photo-change{font-size:13px;font-weight:500;color:var(--mid);background:none;border:none;cursor:pointer;z-index:3;position:relative}
.prog-wrap{display:none;padding:10px 16px 12px;border-top:1px solid var(--bd)}
.prog-wrap.show{display:block}
.prog-track{height:3px;background:var(--lt);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--ink);width:0;transition:width .3s;border-radius:2px}
.prog-lbl{font-size:12px;color:var(--mid);margin-top:4px}

/* Fields */
.fcard{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.frow{display:grid;grid-template-columns:1fr 1fr}
.frow .field:first-child{border-right:1px solid var(--bd)}
.field{display:flex;flex-direction:column}
.flabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);padding:13px 14px 0}
.field input,.field textarea,.field select{font-family:'Inter',sans-serif;font-size:16px;color:var(--ink);background:transparent;border:none;outline:none;padding:5px 14px 13px;width:100%;-webkit-appearance:none;appearance:none}
.field input::placeholder,.field textarea::placeholder{color:#c8c8c4}
.field textarea{resize:none;min-height:84px;line-height:1.55}
.fdiv{height:1px;background:var(--bd);margin:0 14px}

/* Availability */
.avail{padding:13px 14px;display:flex;gap:8px}
.av-btn{flex:1;padding:12px 0;text-align:center;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;border:1.5px solid var(--bd);background:transparent;color:var(--mid);border-radius:10px;cursor:pointer;transition:.15s}
.av-btn.yes{border-color:var(--grn);background:#f0fdf4;color:var(--grn)}
.av-btn.sold{border-color:var(--red);background:#fef2f2;color:var(--red)}

/* Submit */
.submit{width:100%;padding:16px;background:var(--ink);color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;border:none;border-radius:var(--r);cursor:pointer;box-shadow:var(--sh);transition:opacity .15s}
.submit:disabled{opacity:.35;cursor:not-allowed}
.cancel{width:100%;padding:13px;background:transparent;color:var(--mid);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;border:1.5px solid var(--bd);border-radius:var(--r);cursor:pointer}

/* ─── INVENTORY ─── */
.inv-scroll{padding:12px 14px 120px;max-width:560px;margin:0 auto}
.inv-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.inv-seg{display:flex;background:var(--ltr);border-radius:10px;padding:3px;gap:2px}
.seg-btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:6px 14px;border:none;background:transparent;color:var(--mid);border-radius:8px;cursor:pointer;transition:.12s;white-space:nowrap}
.seg-btn.on{background:var(--white);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.inv-count{font-size:12px;color:var(--mid);margin-left:auto}
.inv-list{display:flex;flex-direction:column;gap:2px}

/* Swipe row */
.sw-row{position:relative;border-radius:4px;overflow:hidden;background:var(--red)}
.sw-row:first-child{border-radius:12px 12px 4px 4px}
.sw-row:last-child{border-radius:4px 4px 12px 12px}
.sw-row:only-child{border-radius:12px}
/* Delete bg */
.sw-del-bg{position:absolute;right:0;top:0;bottom:0;width:80px;display:flex;align-items:center;justify-content:center;background:var(--red);cursor:pointer;user-select:none}
.sw-del-bg svg{width:22px;height:22px;color:#fff;flex-shrink:0}
/* Foreground item */
.inv-item{position:relative;background:var(--white);display:flex;align-items:center;gap:12px;padding:11px 13px;touch-action:pan-y;user-select:none;transition:transform .25s cubic-bezier(.25,.46,.45,.94);will-change:transform;cursor:pointer;z-index:1}
.inv-item.swiped{transform:translateX(-80px)}
.inv-thumb{width:50px;height:50px;border-radius:10px;object-fit:cover;background:var(--ltr);flex-shrink:0}
.inv-ph{width:50px;height:50px;border-radius:10px;background:var(--ltr);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.inv-info{flex:1;min-width:0}
.inv-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-sub{font-size:12px;color:var(--mid);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-price{font-size:13px;font-weight:600;margin-top:2px}
.inv-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sdot.g{background:var(--grn)}.sdot.r{background:var(--red)}
.edit-btn{width:32px;height:32px;border-radius:9px;background:var(--ltr);border:none;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0}

.inv-empty{text-align:center;padding:56px 20px;color:var(--mid);font-size:15px;line-height:1.7}
.inv-empty-ico{font-size:34px;margin-bottom:10px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:56px 20px;color:var(--mid);font-size:14px}
.spin{width:18px;height:18px;border:2px solid var(--lt);border-top-color:var(--ink);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ─── SETTINGS DRAWER ─── */
.drw-bg{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);backdrop-filter:blur(3px)}
.drw-bg.open{display:block}
.drw{position:fixed;bottom:0;left:0;right:0;z-index:201;background:var(--white);border-radius:20px 20px 0 0;max-height:80vh;overflow-y:auto;animation:slideUp .22s ease;max-width:560px;margin:0 auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.drw-handle{width:34px;height:4px;background:var(--lt);border-radius:2px;margin:12px auto 0}
.drw-head{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between}
.drw-head h2{font-size:17px;font-weight:600}
.drw-x{width:28px;height:28px;border-radius:50%;background:var(--ltr);border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.drw-body{padding:6px 18px 28px;display:flex;flex-direction:column;gap:14px}
.dlabel{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);margin-bottom:6px}
.dinput{font-family:'Inter',sans-serif;font-size:15px;width:100%;padding:12px 13px;background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;outline:none;color:var(--ink);-webkit-appearance:none}
.dinput:focus{border-color:var(--ink)}
.dinput::placeholder{color:#c8c8c4}
.dsave{width:100%;padding:14px;background:var(--ink);color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;border:none;border-radius:12px;cursor:pointer}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:28px;font-size:14px;font-weight:500;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="bar">
  <div class="bar-title"><div class="dot"></div>Nitzani Admin</div>
  <button class="gear" onclick="openSettings()">⚙️</button>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab on" id="tabAdd" onclick="switchTab('add')">＋ Add Watch</button>
  <button class="tab"    id="tabInv" onclick="switchTab('inv')">Inventory</button>
</div>

<div class="views">

  <!-- ADD FORM -->
  <div class="view on" id="viewAdd">
    <div class="form-scroll">

      <!-- Photo -->
      <div class="photo-box" id="photoBox">
        <input type="file" id="fileIn" accept="image/*">
        <div class="photo-empty" id="photoEmpty">
          <div class="photo-ico">📷</div>
          <div class="photo-lbl">Add Photo</div>
          <div class="photo-sub">Tap or drag · JPG, PNG, HEIC</div>
        </div>
        <img class="photo-img" id="photoImg" alt="">
        <div class="photo-bar" id="photoBar">
          <span style="font-size:13px;color:var(--mid)">Photo ready ✓</span>
          <button class="photo-change" id="changeBtn" type="button">Change</button>
        </div>
        <div class="prog-wrap" id="progWrap">
          <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
          <div class="prog-lbl" id="progLbl">Uploading…</div>
        </div>
      </div>

      <!-- Name + Brand -->
      <div class="fcard">
        <div class="field">
          <div class="flabel">Watch Name *</div>
          <input id="fName" placeholder="e.g. Submariner Date" autocomplete="off">
        </div>
        <div class="fdiv"></div>
        <div class="field">
          <div class="flabel">Brand *</div>
          <input id="fBrand" placeholder="e.g. Rolex" autocomplete="off">
        </div>
      </div>

      <!-- Price + Condition -->
      <div class="fcard">
        <div class="frow">
          <div class="field">
            <div class="flabel">Price *</div>
            <input id="fPrice" placeholder="$12,500" autocomplete="off">
          </div>
          <div class="field">
            <div class="flabel">Condition</div>
            <select id="fCond">
              <option value="">—</option>
              <option>Mint</option><option>Excellent</option>
              <option>Very Good</option><option>Good</option><option>Fair</option>
            </select>
          </div>
        </div>
        <div class="fdiv"></div>
        <div class="frow">
          <div class="field">
            <div class="flabel">Reference</div>
            <input id="fRef" placeholder="116610LN" autocomplete="off">
          </div>
          <div class="field">
            <div class="flabel">Year</div>
            <input id="fYear" type="number" placeholder="2021" autocomplete="off">
          </div>
        </div>
      </div>

      <!-- Description -->
      <div class="fcard">
        <div class="field">
          <div class="flabel">Description</div>
          <textarea id="fDesc" placeholder="Box & papers, service history, bracelet condition…"></textarea>
        </div>
      </div>

      <!-- Availability -->
      <div class="fcard">
        <div class="avail">
          <button class="av-btn yes" id="btnYes"  type="button" onclick="setAvail('Yes')">Available</button>
          <button class="av-btn"     id="btnSold" type="button" onclick="setAvail('Sold')">Sold</button>
        </div>
      </div>

      <button class="submit" id="submitBtn" onclick="submitWatch()">Add to Inventory</button>
      <button class="cancel" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
    </div>
  </div>

  <!-- INVENTORY -->
  <div class="view" id="viewInv">
    <div class="inv-scroll">
      <div class="inv-toolbar">
        <div class="inv-seg">
          <button class="seg-btn on" data-f="all"       onclick="setFilter(this)">All</button>
          <button class="seg-btn"    data-f="available" onclick="setFilter(this)">Available</button>
          <button class="seg-btn"    data-f="sold"      onclick="setFilter(this)">Sold</button>
        </div>
        <span class="inv-count" id="invCount"></span>
      </div>
      <div id="invList"><div class="loading"><div class="spin"></div> Loading…</div></div>
    </div>
  </div>

</div>

<!-- SETTINGS DRAWER -->
<div class="drw-bg" id="drwBg" onclick="closeSettings()"></div>
<div class="drw" id="drw" style="display:none">
  <div class="drw-handle"></div>
  <div class="drw-head">
    <h2>Settings</h2>
    <button class="drw-x" onclick="closeSettings()">✕</button>
  </div>
  <div class="drw-body">
    <div>
      <div class="dlabel">Apps Script URL</div>
      <input class="dinput" id="cfgUrl" type="url" placeholder="https://script.google.com/…">
    </div>
    <button class="dsave" onclick="saveConfig()">Save & Connect</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────
const BAKED_URL = 'https://script.google.com/macros/s/AKfycby3vhoNCQnbZkgp4ORRvl5fEtHIuvMOkNg-6YPPSYxqp3LnlBXtnkEH1tgmdsHr7KJYrQ/exec';
let scriptUrl = localStorage.getItem('nz_url') || BAKED_URL;

// ─── STATE ────────────────────────────────────────────────
let avail = 'Yes', selFile = null, upUrl = '', editId = '';
let allWatches = [], invFilter = 'all';
let activeSwipeRow = null; // track which row is swiped open

// ─── BOOT ─────────────────────────────────────────────────
window.onload = () => {
  document.getElementById('cfgUrl').value = scriptUrl;
  loadInventory();
};

// ─── TABS ─────────────────────────────────────────────────
function switchTab(t) {
  document.getElementById('viewAdd').classList.toggle('on', t === 'add');
  document.getElementById('viewInv').classList.toggle('on', t === 'inv');
  document.getElementById('tabAdd').classList.toggle('on', t === 'add');
  document.getElementById('tabInv').classList.toggle('on', t === 'inv');
  if (t === 'inv') loadInventory();
}

// ─── SETTINGS ─────────────────────────────────────────────
function openSettings() {
  document.getElementById('drwBg').classList.add('open');
  document.getElementById('drw').style.display = 'block';
}
function closeSettings() {
  document.getElementById('drwBg').classList.remove('open');
  document.getElementById('drw').style.display = 'none';
}
function saveConfig() {
  scriptUrl = document.getElementById('cfgUrl').value.trim();
  localStorage.setItem('nz_url', scriptUrl);
  closeSettings();
  toast('Connected ✓');
  loadInventory();
}

// ─── AVAILABILITY ──────────────────────────────────────────
function setAvail(v) {
  avail = v;
  document.getElementById('btnYes').className  = 'av-btn' + (v === 'Yes'  ? ' yes'  : '');
  document.getElementById('btnSold').className = 'av-btn' + (v === 'Sold' ? ' sold' : '');
}

// ─── PHOTO ────────────────────────────────────────────────
const fileIn = document.getElementById('fileIn');
fileIn.addEventListener('change', e => { if (e.target.files[0]) setFile(e.target.files[0]); });
document.getElementById('changeBtn').addEventListener('click', e => {
  e.stopPropagation(); fileIn.value = ''; fileIn.click();
});

// Drag & drop on desktop
const photoBox = document.getElementById('photoBox');
photoBox.addEventListener('dragover', e => { e.preventDefault(); photoBox.style.background = '#e8f5e9'; });
photoBox.addEventListener('dragleave', () => { photoBox.style.background = ''; });
photoBox.addEventListener('drop', e => {
  e.preventDefault(); photoBox.style.background = '';
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) setFile(f);
});

function setFile(f) {
  selFile = f; upUrl = '';
  const r = new FileReader();
  r.onload = ev => {
    const img = document.getElementById('photoImg');
    img.src = ev.target.result;
    img.style.display = 'block';
    document.getElementById('photoEmpty').style.display = 'none';
    document.getElementById('photoBar').classList.add('show');
    fileIn.style.pointerEvents = 'none';
  };
  r.readAsDataURL(f);
}

async function uploadPhoto() {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = async ev => {
      try {
        const resp = await fetch(scriptUrl, { method: 'POST', body: JSON.stringify({
          action: 'uploadImage',
          fileName: selFile.name,
          mimeType: selFile.type,
          base64: ev.target.result.split(',')[1]
        })});
        const j = await resp.json();
        j.url ? res(j.url) : rej(new Error(j.error || 'Upload failed'));
      } catch(e) { rej(e); }
    };
    r.readAsDataURL(selFile);
  });
}

// ─── SUBMIT ───────────────────────────────────────────────
async function submitWatch() {
  const name  = document.getElementById('fName').value.trim();
  const brand = document.getElementById('fBrand').value.trim();
  const price = document.getElementById('fPrice').value.trim();
  if (!name || !brand || !price) { toast('Name, brand & price required'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    if (selFile && !upUrl) {
      prog(35, 'Uploading photo…');
      upUrl = await uploadPhoto();
      prog(100, 'Done ✓');
      setTimeout(hideProgFn, 700);
    }

    const payload = {
      action:      editId ? 'updateWatch' : 'addWatch',
      Name: name, Brand: brand, Price: price,
      Description: document.getElementById('fDesc').value.trim(),
      Condition:   document.getElementById('fCond').value,
      Reference:   document.getElementById('fRef').value.trim(),
      Year:        document.getElementById('fYear').value.trim(),
      Available:   avail,
    };
    if (editId) payload.id    = editId;
    if (upUrl)  payload.Image = upUrl;

    const j = await post(payload);
    if (j.success || j.id) {
      toast(editId ? 'Updated ✓' : 'Watch added ✓');
      resetForm();
      if (editId) switchTab('inv');
    } else throw new Error(j.error || 'Unknown error');
  } catch(e) {
    toast('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = editId ? 'Save Changes' : 'Add to Inventory';
  }
}

function resetForm() {
  editId = ''; selFile = null; upUrl = '';
  ['fName','fBrand','fPrice','fDesc','fRef','fYear'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fCond').value = '';
  setAvail('Yes');
  fileIn.value = ''; fileIn.style.pointerEvents = '';
  const img = document.getElementById('photoImg');
  img.style.display = 'none'; img.src = '';
  document.getElementById('photoEmpty').style.display = 'flex';
  document.getElementById('photoBar').classList.remove('show');
  hideProgFn();
  document.getElementById('submitBtn').textContent = 'Add to Inventory';
  document.getElementById('cancelBtn').style.display = 'none';
}

function cancelEdit() { resetForm(); switchTab('inv'); }

// ─── INVENTORY FILTER ─────────────────────────────────────
function setFilter(btn) {
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  invFilter = btn.dataset.f;
  renderInventory();
}

// ─── LOAD INVENTORY ───────────────────────────────────────
async function loadInventory() {
  document.getElementById('invList').innerHTML = '<div class="loading"><div class="spin"></div> Loading…</div>';
  try {
    const j = await (await fetch(scriptUrl + '?action=getInventory')).json();
    allWatches = (j.watches || []).reverse(); // newest first
    renderInventory();
  } catch(e) {
    document.getElementById('invList').innerHTML = '<div class="inv-empty"><div class="inv-empty-ico">⚠️</div>Couldn\'t load. Check Settings.</div>';
  }
}

function renderInventory() {
  const filtered = allWatches.filter(w => {
    const sold = String(w.Available).toLowerCase() === 'sold';
    if (invFilter === 'available' &&  sold) return false;
    if (invFilter === 'sold'      && !sold) return false;
    return true;
  });

  const avCount   = allWatches.filter(w => String(w.Available).toLowerCase() !== 'sold').length;
  const soldCount = allWatches.length - avCount;
  document.getElementById('invCount').textContent =
    filtered.length + ' shown · ' + avCount + ' av · ' + soldCount + ' sold';

  if (!filtered.length) {
    document.getElementById('invList').innerHTML =
      '<div class="inv-empty"><div class="inv-empty-ico">⌚</div>' +
      (invFilter === 'all' ? 'No watches yet.<br>Add your first one!' : 'No ' + invFilter + ' watches.') + '</div>';
    return;
  }

  const listEl = document.createElement('div');
  listEl.className = 'inv-list';

  filtered.forEach(w => {
    const sold = String(w.Available).toLowerCase() === 'sold';
    // Outer row (position: relative, red bg shows behind)
    const row = document.createElement('div');
    row.className = 'sw-row';

    // Red delete background
    const delBg = document.createElement('div');
    delBg.className = 'sw-del-bg';
    delBg.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
    delBg.addEventListener('click', e => { e.stopPropagation(); confirmDelete(w, row); });

    // Foreground item
    const item = document.createElement('div');
    item.className = 'inv-item';
    item.innerHTML = `
      ${w.Image
        ? `<img class="inv-thumb" src="${w.Image}" alt="" onerror="this.outerHTML='<div class=inv-ph>⌚</div>'">`
        : '<div class="inv-ph">⌚</div>'}
      <div class="inv-info">
        <div class="inv-name">${(w.Brand || '') + ' ' + (w.Name || 'Untitled')}</div>
        <div class="inv-sub">${[w.Condition, w.Year].filter(Boolean).join(' · ') || '—'}</div>
        <div class="inv-price">${w.Price || '—'}</div>
      </div>
      <div class="inv-right">
        <div class="sdot ${sold ? 'r' : 'g'}"></div>
        <button class="edit-btn" title="Edit">✏️</button>
      </div>`;

    // Edit button
    item.querySelector('.edit-btn').addEventListener('click', e => {
      e.stopPropagation();
      startEdit(w);
    });

    // Tap item (if not swiped) → edit
    item.addEventListener('click', () => {
      if (item.classList.contains('swiped')) {
        item.classList.remove('swiped');
        activeSwipeRow = null;
      } else {
        startEdit(w);
      }
    });

    // ── SWIPE TO DELETE ──────────────────────────────────
    let startX = 0, startY = 0, isDragging = false, isHorizontal = null;

    item.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isDragging = false;
      isHorizontal = null;
    }, { passive: true });

    item.addEventListener('touchmove', e => {
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;

      if (isHorizontal === null) {
        isHorizontal = Math.abs(dx) > Math.abs(dy);
      }
      if (!isHorizontal) return;

      e.preventDefault();
      isDragging = true;

      const x = Math.max(-90, Math.min(0, dx + (item.classList.contains('swiped') ? -80 : 0)));
      item.style.transition = 'none';
      item.style.transform = `translateX(${x}px)`;
    }, { passive: false });

    item.addEventListener('touchend', e => {
      if (!isHorizontal) return;
      item.style.transition = '';
      const dx = e.changedTouches[0].clientX - startX;
      const threshold = -40;

      if (dx < threshold) {
        // Snap open
        if (activeSwipeRow && activeSwipeRow !== item) {
          activeSwipeRow.classList.remove('swiped');
          activeSwipeRow.style.transform = '';
        }
        item.classList.add('swiped');
        item.style.transform = '';
        activeSwipeRow = item;
      } else {
        // Snap closed
        item.classList.remove('swiped');
        item.style.transform = '';
        if (activeSwipeRow === item) activeSwipeRow = null;
      }
      isDragging = false;
    });

    row.appendChild(delBg);
    row.appendChild(item);
    listEl.appendChild(row);
  });

  // Close swipe on scroll
  document.getElementById('invList').innerHTML = '';
  document.getElementById('invList').appendChild(listEl);

  document.getElementById('viewInv').addEventListener('scroll', () => {
    if (activeSwipeRow) {
      activeSwipeRow.classList.remove('swiped');
      activeSwipeRow.style.transform = '';
      activeSwipeRow = null;
    }
  }, { passive: true });
}

// ─── EDIT ─────────────────────────────────────────────────
function startEdit(w) {
  editId = w.ID || w.Id || w.id || '';
  document.getElementById('fName').value  = w.Name  || '';
  document.getElementById('fBrand').value = w.Brand || '';
  document.getElementById('fPrice').value = w.Price || '';
  document.getElementById('fDesc').value  = w.Description || '';
  document.getElementById('fCond').value  = w.Condition   || '';
  document.getElementById('fRef').value   = w.Reference   || '';
  document.getElementById('fYear').value  = w.Year        || '';
  setAvail(String(w.Available).toLowerCase() === 'sold' ? 'Sold' : 'Yes');

  if (w.Image) {
    upUrl = w.Image;
    const img = document.getElementById('photoImg');
    img.src = w.Image; img.style.display = 'block';
    document.getElementById('photoEmpty').style.display = 'none';
    document.getElementById('photoBar').classList.add('show');
    fileIn.style.pointerEvents = 'none';
  }

  document.getElementById('submitBtn').textContent = 'Save Changes';
  document.getElementById('cancelBtn').style.display = 'block';
  switchTab('add');
  document.getElementById('viewAdd').scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── DELETE ───────────────────────────────────────────────
function confirmDelete(w, rowEl) {
  // Inline confirm — change the row bg text to "Tap again to confirm"
  const delBg = rowEl.querySelector('.sw-del-bg');
  const originalHtml = delBg.innerHTML;
  delBg.innerHTML = '<span style="color:#fff;font-size:12px;font-weight:600;text-align:center;padding:0 8px;line-height:1.3">Tap to<br>confirm</span>';
  delBg.style.background = '#b91c1c';

  let confirmed = false;
  delBg.onclick = async e => {
    e.stopPropagation();
    if (confirmed) return;
    confirmed = true;
    delBg.innerHTML = '<div style="width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite"></div>';
    try {
      const watchId = w.ID || w.Id || w.id || '';
      if (!watchId) throw new Error('No ID found');
      const j = await post({ action: 'deleteWatch', id: watchId });
      if (j.success) {
        rowEl.style.transition = 'opacity .2s, transform .2s';
        rowEl.style.opacity = '0';
        rowEl.style.transform = 'translateX(-100%)';
        setTimeout(() => {
          rowEl.remove();
          allWatches = allWatches.filter(x => (x.ID || x.Id || x.id) !== watchId);
          const avCount   = allWatches.filter(x => String(x.Available).toLowerCase() !== 'sold').length;
          const soldCount = allWatches.length - avCount;
          const filtered  = allWatches.filter(x => {
            const s = String(x.Available).toLowerCase() === 'sold';
            if (invFilter === 'available' && s)  return false;
            if (invFilter === 'sold'      && !s) return false;
            return true;
          });
          document.getElementById('invCount').textContent =
            filtered.length + ' shown · ' + avCount + ' av · ' + soldCount + ' sold';
        }, 220);
        toast('Deleted');
        activeSwipeRow = null;
      } else throw new Error(j.error || 'Delete failed');
    } catch(e) {
      toast('Error: ' + e.message);
      delBg.innerHTML = originalHtml;
      delBg.style.background = '';
      delBg.onclick = e2 => { e2.stopPropagation(); confirmDelete(w, rowEl); };
    }
  };

  // Reset if user swipes back
  setTimeout(() => {
    const item = rowEl.querySelector('.inv-item');
    if (item && !item.classList.contains('swiped')) {
      delBg.innerHTML = originalHtml;
      delBg.style.background = '';
      delBg.onclick = e => { e.stopPropagation(); confirmDelete(w, rowEl); };
    }
  }, 4000);
}

// ─── HELPERS ──────────────────────────────────────────────
async function post(data) {
  const r = await fetch(scriptUrl, { method: 'POST', body: JSON.stringify(data) });
  return r.json();
}

function prog(pct, lbl) {
  document.getElementById('progWrap').classList.add('show');
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLbl').textContent = lbl;
}
function hideProgFn() { document.getElementById('progWrap').classList.remove('show'); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

// Close swipe row when tapping elsewhere
document.addEventListener('touchstart', e => {
  if (activeSwipeRow && !activeSwipeRow.closest('.sw-row')?.contains(e.target)) {
    activeSwipeRow.classList.remove('swiped');
    activeSwipeRow.style.transform = '';
    activeSwipeRow = null;
  }
}, { passive: true });
</script>
